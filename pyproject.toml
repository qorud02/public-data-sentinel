[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "public-data-sentinel"
version = "0.2.0"
description = "Validate CSV, TSV and JSON public-data extracts against explicit, small data contracts."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "qorud02"}]
dependencies = []

[project.optional-dependencies]
test = ["markdown-it-py==4.2.0"]

[project.scripts]
data-sentinel = "public_data_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
