name: Source archive and installed wheel

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install build and test tools
        run: python -m pip install build ".[test]"
      - name: Warm the checkout before packaging
        run: python -m compileall -q src tests
      - name: Build source archive and wheel from that archive
        run: python -m build --outdir dist
      - name: Verify extracted tests and installed command
        run: python scripts/verify_distribution.py dist
      - name: Retain verified distributions and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-data-sentinel-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
